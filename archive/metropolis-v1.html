<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metropolis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dfe6ee; --panel:rgba(250,251,253,0.74); --edge:rgba(20,26,36,0.10);
  --text:#141a24; --muted:#556072; --lamp:#c98a12; --chip:#141a24; --chip-text:#f6f7f9;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#04060b; --panel:rgba(10,14,22,0.58); --edge:rgba(255,255,255,0.10);
    --text:#eef1f6; --muted:#97a1b3; --lamp:#f2b33d; --chip:#f2b33d; --chip-text:#1a1306;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#04060b; --panel:rgba(10,14,22,0.58); --edge:rgba(255,255,255,0.10);
  --text:#eef1f6; --muted:#97a1b3; --lamp:#f2b33d; --chip:#f2b33d; --chip-text:#1a1306;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);overflow:hidden;
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.title{position:fixed;top:0;left:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;pointer-events:none;}
.title h1{margin:0;font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:800;
  font-size:clamp(34px,6vw,56px);line-height:0.9;letter-spacing:0.01em;color:#fff;
  text-shadow:0 2px 18px rgba(0,0,0,0.45);}
.title p{margin:6px 0 0;font-size:13px;color:rgba(255,255,255,0.86);text-shadow:0 1px 8px rgba(0,0,0,0.5);}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding:0 12px calc(env(safe-area-inset-bottom,0px) + 18px);pointer-events:none;}
.bar{pointer-events:auto;display:flex;gap:6px;align-items:center;padding:6px;border-radius:999px;
  background:var(--panel);border:1px solid var(--edge);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);}
.bar button{font:inherit;font-size:14px;font-weight:600;border:0;cursor:pointer;color:var(--text);
  background:transparent;padding:10px 16px;border-radius:999px;transition:background .2s,color .2s;}
.bar button[aria-pressed="true"]{background:var(--chip);color:var(--chip-text);}
.bar button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;}
.sep{width:1px;height:22px;background:var(--edge);margin:0 2px;}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);color:var(--muted);
  font-size:15px;transition:opacity .8s ease;z-index:5;}
#loader.gone{opacity:0;pointer-events:none;}
#err{display:none;position:fixed;inset:0;place-items:center;padding:24px;text-align:center;color:var(--text);background:var(--bg);}
@media (prefers-reduced-motion: reduce){ #loader{transition:none;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title"><h1>Metropolis</h1><p>Drag to orbit, pinch or scroll to zoom</p></div>
<div class="dock"><div class="bar" role="group" aria-label="Lighting">
  <button data-mode="day" aria-pressed="false">Day</button>
  <button data-mode="dusk" aria-pressed="true">Dusk</button>
  <button data-mode="night" aria-pressed="false">Night</button>
  <span class="sep"></span>
  <button id="tour" aria-pressed="true">Orbit</button>
</div></div>
<div id="loader">Raising the skyline…</div>
<div id="err">This rendering needs WebGL. Try a recent version of Chrome, Safari or Firefox.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/GammaCorrectionShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('err').style.display='grid'; return; }

const C = h => new THREE.Color(h).convertSRGBToLinear();
let _s = 20261121;
function rand(){ _s|=0; _s=_s+0x6D2B79F5|0; let t=Math.imul(_s^_s>>>15,1|_s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }
const rr=(a,b)=>a+(b-a)*rand();
const pick=a=>a[Math.floor(rand()*a.length)];
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || Math.min(screen.width,screen.height)<700;

/* ---------- renderer ---------- */
const canvas=document.getElementById('c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'}); }
catch(e){ document.getElementById('err').style.display='grid'; document.getElementById('loader').remove(); return; }
const DPR=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,0.0002);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,1,15000);
camera.position.set(1650,600,-2150);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.set(0,70,-250);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.maxPolarAngle=1.47; controls.minDistance=90; controls.maxDistance=6000;
controls.autoRotate=true; controls.autoRotateSpeed=0.3;
controls.update();

const uNight={value:0.75}, uTime={value:0};

/* ---------- sky ---------- */
const skyU={
  top:{value:new THREE.Color()}, horizon:{value:new THREE.Color()}, bottom:{value:new THREE.Color()},
  sunColor:{value:new THREE.Color()}, sunDir:{value:new THREE.Vector3(0,1,0)}, sunSize:{value:1}, stars:{value:0}
};
const skyMat=new THREE.ShaderMaterial({
  uniforms:skyU, side:THREE.BackSide, depthWrite:false, fog:false,
  vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`
    uniform vec3 top, horizon, bottom, sunColor, sunDir; uniform float sunSize, stars;
    varying vec3 vDir;
    float h3(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
    void main(){
      vec3 d=normalize(vDir); float h=d.y;
      vec3 col = h>0.0 ? mix(horizon, top, pow(smoothstep(0.0,1.0,h),0.55)) : mix(horizon,bottom,smoothstep(0.0,0.2,-h));
      float s=max(dot(d,normalize(sunDir)),0.0);
      col += sunColor*(pow(s,900.0)*6.0*sunSize + pow(s,14.0)*0.45 + pow(s,3.0)*0.14);
      vec3 q=floor(d*520.0);
      float st=step(0.9978,h3(q))*smoothstep(0.04,0.35,h)*stars*(0.5+0.5*h3(q+3.1));
      col += vec3(st);
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(9000,48,24),skyMat);
sky.renderOrder=-1; scene.add(sky);
const envScene=new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,16),skyMat));
const pmrem=new THREE.PMREMGenerator(renderer);
let envRT=null;
function updateEnv(){ const rt=pmrem.fromScene(envScene,0.02,0.1,500); scene.environment=rt.texture; if(envRT) envRT.dispose(); envRT=rt; }

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,0.5); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.castShadow=true;
const SM=isMobile?2048:4096;
sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-1900,right:1900,top:1900,bottom:-1900,near:100,far:8000});
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias=-0.0004; sun.shadow.normalBias=1.2;
sun.target.position.set(0,0,-80);
scene.add(sun); scene.add(sun.target);

/* ---------- textures ---------- */
function makeGlow(){
  const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.22,'rgba(255,255,255,0.9)');
  gr.addColorStop(0.55,'rgba(255,255,255,0.18)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
}
const glow=makeGlow();

/* ---------- materials ---------- */
const cityMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.84,metalness:0.04});
cityMat.onBeforeCompile=(sh)=>{
  sh.uniforms.uNight=uNight;
  sh.vertexShader=sh.vertexShader
    .replace('#include <common>','#include <common>\nvarying vec3 vWPos;\nvarying vec3 vWNorm;')
    .replace('#include <begin_vertex>',`#include <begin_vertex>
      vec4 cwp=vec4(transformed,1.0); vec3 cwn=objectNormal;
      #ifdef USE_INSTANCING
        cwp=instanceMatrix*cwp; cwn=mat3(instanceMatrix)*cwn;
      #endif
      cwp=modelMatrix*cwp; vWPos=cwp.xyz; vWNorm=normalize(mat3(modelMatrix)*cwn);`);
  sh.fragmentShader=sh.fragmentShader
    .replace('#include <common>',`#include <common>
      uniform float uNight; varying vec3 vWPos; varying vec3 vWNorm;
      float ch21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }`)
    .replace('#include <color_fragment>',`#include <color_fragment>
      vec3 can=abs(vWNorm);
      float cRoof=step(0.6,can.y);
      float cAxis=step(can.z,can.x);
      float cH=mix(vWPos.x,vWPos.z,cAxis);
      vec2 cCell=vec2(cH/3.1,vWPos.y/3.7);
      vec2 cId=floor(cCell); vec2 cF=fract(cCell);
      float cWin=step(0.16,cF.x)*step(cF.x,0.84)*step(0.22,cF.y)*step(cF.y,0.86);
      cWin*=(1.0-cRoof)*step(5.0,vWPos.y);
      float cSgn=sign(dot(vWNorm,vec3(1.0,0.0,1.0)));
      float cR=ch21(cId+vec2(cAxis*91.7+cSgn*13.3,cSgn*7.1));
      float cR2=ch21(cId.yx*1.37+3.1+cSgn);
      float cLit=step(cR,0.42);
      float cShop=(1.0-cRoof)*step(0.6,vWPos.y)*(1.0-step(4.2,vWPos.y));
      diffuseColor.rgb=mix(diffuseColor.rgb, vec3(0.03,0.045,0.065)+diffuseColor.rgb*0.12, cWin*0.88);
      diffuseColor.rgb*=mix(1.0,0.8,cRoof);`)
    .replace('#include <roughnessmap_fragment>','#include <roughnessmap_fragment>\nroughnessFactor=mix(roughnessFactor,0.1,cWin);')
    .replace('#include <metalnessmap_fragment>','#include <metalnessmap_fragment>\nmetalnessFactor=mix(metalnessFactor,0.65,cWin);')
    .replace('#include <emissivemap_fragment>',`#include <emissivemap_fragment>
      vec3 cWarm=mix(vec3(1.0,0.7,0.4),vec3(0.75,0.86,1.0),step(0.74,cR2));
      cWarm=mix(cWarm,vec3(1.0,0.9,0.72),step(0.45,cR2)*step(cR2,0.6));
      float cDim=0.5+0.5*ch21(cId*0.73+11.0);
      totalEmissiveRadiance+=cWin*cLit*cDim*uNight*cWarm*2.7;
      totalEmissiveRadiance+=cShop*uNight*vec3(1.0,0.76,0.48)*1.5;`);
};

const waterMat=new THREE.MeshStandardMaterial({color:C(0x0d2433),roughness:0.16,metalness:0.0,envMapIntensity:1.3});
waterMat.onBeforeCompile=(sh)=>{
  sh.uniforms.uTime=uTime;
  sh.vertexShader=sh.vertexShader
    .replace('#include <common>','#include <common>\nvarying vec3 vWPos;')
    .replace('#include <begin_vertex>','#include <begin_vertex>\nvWPos=(modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader=sh.fragmentShader
    .replace('#include <common>','#include <common>\nuniform float uTime; varying vec3 vWPos;')
    .replace('#include <normal_fragment_maps>',`#include <normal_fragment_maps>
      { vec2 p=vWPos.xz*0.025; float t=uTime;
        float nx=sin(p.x*3.1+t*0.9)*0.5+sin(p.y*4.7+p.x*1.3-t*1.3)*0.3+sin((p.x+p.y)*9.0+t*2.0)*0.2+sin(p.x*21.0-t*2.6)*0.08;
        float nz=cos(p.y*3.4-t*0.8)*0.5+cos(p.x*5.1-p.y*1.7+t*1.1)*0.3+cos((p.x-p.y)*8.0-t*1.7)*0.2+cos(p.y*23.0+t*2.4)*0.08;
        vec3 wn=normalize(vec3(nx*0.07,1.0,nz*0.07));
        normal=normalize((viewMatrix*vec4(wn,0.0)).xyz); }`);
};

const asphalt=new THREE.MeshStandardMaterial({color:C(0x26282c),roughness:0.93});
const pavement=new THREE.MeshStandardMaterial({color:C(0x75736d),roughness:0.95});
const landMat=new THREE.MeshStandardMaterial({color:C(0x303236),roughness:0.95});
const grassMat=new THREE.MeshStandardMaterial({color:C(0x3c5a2c),roughness:1});
const plainMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.9});
const metalMat=new THREE.MeshStandardMaterial({color:C(0xc4c8ce),roughness:0.25,metalness:0.9});
const woodMat=new THREE.MeshStandardMaterial({color:C(0x5f4330),roughness:0.95});

/* ---------- geography ---------- */
const AV=[]; for(let i=0;i<=8;i++) AV.push(-300+i*75);
const AVW=14, ST=32, STW=9;
function halfW(z){
  if(z<-1000) return 300*Math.pow(Math.min(Math.max((z+1450)/450,0),1),0.55);
  if(z>1250) return Math.max(300-(z-1250)*0.9,0);
  return 300;
}
const PARK={x0:-143,x1:143,z0:384,z1:1056};
const LAKES=[{x:0,z:840,rx:92,rz:108},{x:62,z:470,rx:30,rz:18},{x:-70,z:610,rx:22,rz:34}];
const inLake=(x,z,m)=>LAKES.some(l=>((x-l.x)/(l.rx+m))**2+((z-l.z)/(l.rz+m))**2<1);
const overlap=(a0,a1,b0,b1,r)=>a0<r.x1&&a1>r.x0&&b0<r.z1&&b1>r.z0;

/* island */
{
  const sh=new THREE.Shape(); const pts=[];
  for(let z=-1460;z<=1590;z+=20) pts.push([halfW(z)+16,z]);
  for(let z=1590;z>=-1460;z-=20) pts.push([-(halfW(z)+16),z]);
  sh.moveTo(pts[0][0],-pts[0][1]); for(let i=1;i<pts.length;i++) sh.lineTo(pts[i][0],-pts[i][1]);
  const g=new THREE.ExtrudeGeometry(sh,{depth:10,bevelEnabled:false,curveSegments:1}); g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,asphalt); m.position.y=-10; m.receiveShadow=true; scene.add(m);
}
/* other boroughs */
function land(x0,x1,z0,z1){ const m=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,12,z1-z0),landMat); m.position.set((x0+x1)/2,-6,(z0+z1)/2); m.receiveShadow=true; scene.add(m); }
land(660,5600,-2600,3400); land(-5600,-600,-2600,3400); land(-600,660,1760,3400);
/* water */
{ const g=new THREE.PlaneGeometry(40000,40000,1,1); g.rotateX(-Math.PI/2); const w=new THREE.Mesh(g,waterMat); w.position.y=-2; w.receiveShadow=true; scene.add(w); }

/* ---------- buildings ---------- */
const PAL_OLD=[0xcfc4b2,0xb9a58c,0x9b5c46,0x86503f,0xd9d1c3,0x7d6f62,0xa89884,0xbfae96];
const PAL_NEW=[0x56677a,0x3f4c5a,0x7d8b99,0x2f3a46,0x9aa6b2,0x6a7f8f,0x4b5560];
const B=[], SLABS=[], SPIRES=[], WT=[], WARN=[];
function addBox(x,z,w,d,y0,y1,c){ B.push({x,z,w,d,y0,h:y1-y0,c}); }
function addTower(cx,cz,w,d,h,low){
  const glassP=low?0.06:Math.min(Math.max((h-50)/220,0),0.8);
  const c=C(rand()<glassP?pick(PAL_NEW):pick(PAL_OLD)); c.offsetHSL(0,rr(-0.02,0.02),rr(-0.025,0.025));
  let topY=h;
  if(!low && h>100 && rand()<0.7){
    const tiers=h>220?3+Math.floor(rand()*2):2;
    let y=0,cw=w,cd=d;
    for(let t=0;t<tiers;t++){
      const top=t===tiers-1?h:y+(h-y)*rr(0.45,0.66);
      addBox(cx,cz,cw,cd,y,top,c); y=top; cw*=rr(0.68,0.86); cd*=rr(0.68,0.86);
    }
    if(h>200 && rand()<0.4){ const sh=h*rr(0.08,0.18); SPIRES.push({x:cx,z:cz,y:h,r:Math.min(cw,cd)*0.12+0.6,h:sh}); topY=h+sh; }
    else if(rand()<0.5){ const mh=rr(4,9); addBox(cx,cz,cw*0.5,cd*0.5,h,h+mh,C(0x55585e)); topY=h+mh; }
  } else {
    addBox(cx,cz,w,d,0,h,c);
    if(!low && h<75 && w>9 && d>9 && rand()<0.3) WT.push({x:cx+rr(-w*0.25,w*0.25),z:cz+rr(-d*0.25,d*0.25),y:h,r:rr(2.2,3.2)});
    else if(h>40 && rand()<0.4) addBox(cx+rr(-w*0.15,w*0.15),cz,w*rr(0.3,0.5),d*rr(0.3,0.5),h,h+rr(3,7),C(0x5d6066));
  }
  if(topY>150) WARN.push(cx,topY+1.5,cz);
}
function heightAt(x,z){
  const down=Math.exp(-Math.pow((z+1180)/170,2))*230;
  const mid=Math.exp(-Math.pow((z+150)/330,2))*Math.exp(-Math.pow(x/260,2))*270;
  const parkEdge=(z>360&&z<1080&&Math.abs(x)<240&&Math.abs(x)>140)?80:0;
  const base=20+22*Math.exp(-Math.pow((z-200)/900,2));
  let h=(base+down+mid+parkEdge)*rr(0.45,1.25);
  if(rand()<0.03) h*=1.8;
  if(z>300&&z<375&&rand()<0.3) h=rr(260,420);
  return Math.max(10,h);
}

/* landmark towers */
const EXCL=[{x0:-75,x1:0,z0:-200,z1:-130},{x0:-150,x1:-75,z0:-1232,z1:-1150}];
[[56,46,0,90],[44,36,90,190],[32,26,190,265],[22,18,265,310],[14,12,310,335],[9,8,335,350]]
  .forEach(t=>addBox(-37.5,-165,t[0],t[1],t[2],t[3],C(0xcdc3b0)));
SPIRES.push({x:-37.5,z:-165,y:350,r:2.4,h:62}); WARN.push(-37.5,413,-165);
[[54,54,0,40],[46,46,40,400],[30,30,400,422]].forEach(t=>addBox(-112.5,-1191,t[0],t[1],t[2],t[3],C(0x56687a)));
SPIRES.push({x:-112.5,z:-1191,y:422,r:2,h:120}); WARN.push(-112.5,543,-1191);

function addBlock(x0,x1,z0,z1){
  if(overlap(x0,x1,z0,z1,PARK)) return;
  SLABS.push({x:(x0+x1)/2,z:(z0+z1)/2,w:x1-x0,d:z1-z0});
  const D=z1-z0, rows=(D>20&&rand()<0.5)?2:1;
  for(let r=0;r<rows;r++){
    const lz0=z0+r*D/rows, lz1=z0+(r+1)*D/rows;
    let x=x0+1;
    while(x<x1-1){
      const cz=(lz0+lz1)/2;
      const h=heightAt(x+10,cz);
      let lw=Math.min(h>120?rr(20,42):rr(9,24),x1-1-x);
      if(x1-1-(x+lw)<8) lw=x1-1-x;
      const bx0=x,bx1=x+lw; x+=lw;
      if(EXCL.some(e=>overlap(bx0,bx1,lz0,lz1,e))) continue;
      addTower((bx0+bx1)/2,cz,lw-1.2,(lz1-lz0)-1.2,h,false);
    }
  }
}
for(let i=0;i<8;i++){
  const x0=AV[i]+AVW/2, x1=AV[i+1]-AVW/2;
  for(let z=-1440;z<1580;z+=ST){
    const z0=z+STW/2, z1=z+ST-STW/2;
    const hw=Math.min(halfW(z0),halfW(z1))-6;
    const cx0=Math.max(x0,-hw), cx1=Math.min(x1,hw);
    if(cx1-cx0<14) continue;
    addBlock(cx0,cx1,z0,z1);
  }
}
/* outer boroughs */
const boroLights=[];
function cluster(x,z){
  const g=(cx,cz,r,a)=>Math.exp(-((x-cx)**2+(z-cz)**2)/(r*r))*a;
  return g(820,-1000,180,150)+g(780,120,160,170)+g(-740,-1120,200,190)+g(-700,-300,160,70);
}
function borough(xA,xB,zA,zB,sp){
  for(let x=xA;x<xB;x+=sp) for(let z=zA;z<zB;z+=sp){
    if(rand()<0.6) boroLights.push(x-sp/2,5,z+rr(-3,3));
    if(rand()<0.42) continue;
    const cx=x+rr(-4,4), cz=z+rr(-4,4);
    let h=rr(7,22); if(rand()<0.06) h=rr(30,60);
    h+=cluster(cx,cz)*rr(0.3,1.1);
    addTower(cx,cz,rr(10,sp-10),rr(10,sp-10),h,h<60);
  }
}
const BSP=isMobile?44:40;
borough(720,2300,-2300,3000,BSP);
borough(-2300,-640,-2300,3000,BSP);
borough(-560,620,1820,3000,BSP);

/* instancing helper */
const dummy=new THREE.Object3D();
function instanced(geo,mat,list,setter,cast,receive){
  const m=new THREE.InstancedMesh(geo,mat,list.length);
  list.forEach((b,i)=>{ setter(dummy,b); dummy.updateMatrix(); m.setMatrixAt(i,dummy.matrix); if(b.c) m.setColorAt(i,b.c); });
  if(m.instanceColor) m.instanceColor.needsUpdate=true;
  m.castShadow=!!cast; m.receiveShadow=!!receive; m.frustumCulled=false; scene.add(m); return m;
}
const boxBase=new THREE.BoxGeometry(1,1,1); boxBase.translate(0,0.5,0);
instanced(boxBase,cityMat,B,(d,b)=>{d.position.set(b.x,b.y0,b.z);d.scale.set(b.w,b.h,b.d);},true,true);
instanced(boxBase,pavement,SLABS,(d,b)=>{d.position.set(b.x,0,b.z);d.scale.set(b.w,0.35,b.d);},false,true);
const coneBase=new THREE.ConeGeometry(1,1,8); coneBase.translate(0,0.5,0);
instanced(coneBase,metalMat,SPIRES,(d,b)=>{d.position.set(b.x,b.y,b.z);d.scale.set(b.r,b.h,b.r);},true,false);
const cylBase=new THREE.CylinderGeometry(1,1,1,12); cylBase.translate(0,0.5,0);
const coneR=new THREE.ConeGeometry(1,1,12); coneR.translate(0,0.5,0);
instanced(cylBase,woodMat,WT,(d,b)=>{d.position.set(b.x,b.y+2,b.z);d.scale.set(b.r,b.r*1.5,b.r);},true,false);
instanced(coneR,woodMat,WT,(d,b)=>{d.position.set(b.x,b.y+2+b.r*1.5,b.z);d.scale.set(b.r*1.1,b.r*0.8,b.r*1.1);},false,false);
const legs=[]; WT.forEach(w=>{[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(s=>legs.push({x:w.x+s[0]*w.r*0.6,z:w.z+s[1]*w.r*0.6,y:w.y}));});
instanced(boxBase,woodMat,legs,(d,b)=>{d.position.set(b.x,b.y,b.z);d.scale.set(0.35,2,0.35);},false,false);

/* ---------- park ---------- */
{
  const p=new THREE.Mesh(new THREE.BoxGeometry(PARK.x1-PARK.x0,0.6,PARK.z1-PARK.z0),grassMat);
  p.position.set(0,0.3,(PARK.z0+PARK.z1)/2); p.receiveShadow=true; scene.add(p);
  LAKES.forEach(l=>{ const g=new THREE.CircleGeometry(1,64); g.rotateX(-Math.PI/2); const m=new THREE.Mesh(g,waterMat); m.scale.set(l.rx,1,l.rz); m.position.set(l.x,0.68,l.z); scene.add(m); });
  const TREES=[]; const greens=[0x2f5a2a,0x3d6b30,0x4a7a35,0x2a4a26,0x56813a,0x6b8a3a];

/* ---------- points (lights) ---------- */
function makePoints(arr,color,size,mult){
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  const m=new THREE.PointsMaterial({size,map:glow,color:C(color).multiplyScalar(mult),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true});
  const p=new THREE.Points(g,m); p.frustumCulled=false; scene.add(p); return p;
}
const streetArr=[];
AV.forEach(ax=>{ for(let z=-1450;z<1590;z+=18){ if(halfW(z)<Math.abs(ax)-4) continue; [-8.5,8.5].forEach(o=>{ const x=ax+o; if(inLake(x,z,2)) return; streetArr.push(x,6,z); }); } });
for(let k=0;k<96;k+=3){ const zs=-1440+k*ST; const hw=halfW(zs)-4; if(hw<20) continue; if(zs>PARK.z0&&zs<PARK.z1) continue; for(let x=-hw;x<hw;x+=19) streetArr.push(x,6,zs+4.5); }
const streetPts=makePoints(streetArr,0xffae5c,5.5,2.2);

/* ---------- bridges ---------- */
const bridgeMat=new THREE.MeshStandardMaterial({color:C(0x7d756a),roughness:0.85});
const steelMat=new THREE.MeshStandardMaterial({color:C(0x596068),roughness:0.5,metalness:0.5});
const necklace=[];
function addMesh(geo,mat,x,y,z,rz){ const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); if(rz) m.rotation.z=rz; m.castShadow=true; m.receiveShadow=true; scene.add(m); return m; }
function bridge(z,xA,xB,deckY,towerH){
  const s=Math.sign(xB-xA), len=Math.abs(xB-xA), cx=(xA+xB)/2;
  addMesh(new THREE.BoxGeometry(len,3,16),bridgeMat,cx,deckY,z);
  const rl=deckY*3.2, ang=Math.atan2(deckY,rl), rlen=Math.hypot(rl,deckY);
  addMesh(new THREE.BoxGeometry(rlen,2.5,14),bridgeMat,xA-s*rl/2,deckY/2,z,s*ang);
  addMesh(new THREE.BoxGeometry(rlen,2.5,14),bridgeMat,xB+s*rl/2,deckY/2,z,-s*ang);
  const tA=xA+s*len*0.2, tB=xB-s*len*0.2;
  [tA,tB].forEach(t=>{
    [-9,9].forEach(o=>addMesh(new THREE.BoxGeometry(6,towerH,5),bridgeMat,t,towerH/2,z+o));
    addMesh(new THREE.BoxGeometry(6,6,24),bridgeMat,t,towerH-5,z);
    addMesh(new THREE.BoxGeometry(6,4,24),bridgeMat,t,deckY+16,z);
  });
  const sus=[];
  [-8.5,8.5].forEach(o=>{
    const pts=[];
    for(let i=0;i<=20;i++){ const u=i/20; pts.push(new THREE.Vector3(xA+(tA-xA)*u, deckY+2+(towerH-deckY-2)*u-Math.sin(u*Math.PI)*5, z+o)); }
    for(let i=1;i<=60;i++){ const u=i/60; const y=towerH-(1-(2*u-1)**2)*(towerH-deckY-5); const x=tA+(tB-tA)*u; pts.push(new THREE.Vector3(x,y,z+o)); if(i%3===0) necklace.push(x,y+1,z+o); if(i<60) sus.push(x,y,z+o,x,deckY+1.5,z+o); }
    for(let i=1;i<=20;i++){ const u=i/20; pts.push(new THREE.Vector3(tB+(xB-tB)*u, towerH-(towerH-deckY-2)*u-Math.sin(u*Math.PI)*5, z+o)); }
    const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),240,0.8,6,false),steelMat); tube.castShadow=true; scene.add(tube);
  });
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.Float32BufferAttribute(sus,3));
  scene.add(new THREE.LineSegments(sg,new THREE.LineBasicMaterial({color:C(0x4a5058),transparent:true,opacity:0.6})));
  WARN.push(tA,towerH+1,z-9,tB,towerH+1,z+9);
}
[[-1088,22,92],[-800,20,84],[160,24,100]].forEach(b=>{ const xA=halfW(b[0])+16; bridge(b[0],xA,665,b[1],b[2]); });
bridge(1312,-(halfW(1312)+16),-605,26,118);
warnPts.geometry.setAttribute('position',new THREE.Float32BufferAttribute(WARN,3));
const necklacePts=makePoints(necklace,0xfff1d8,3.4,2.6);

/* ---------- traffic ---------- */
const cars=[];
const CAR_COLORS=[0x1c1e22,0xe6e6e4,0x6b7078,0x8a1c1c,0x1f3a5f,0x2c2c2c,0x9aa0a6];
function carColor(){ return C(rand()<0.32?0xf3b712:pick(CAR_COLORS)); }
AV.forEach((ax,i)=>{
  const dir=i%2===0?1:-1, edge=Math.abs(ax)>=300;
  const ok=z=>halfW(z)>=Math.abs(ax)-(edge?4:-8);
  let zm=-1440; while(!ok(zm)&&zm<1500) zm+=10;
  let zM=1580; while(!ok(zM)&&zM>zm) zM-=10;
  if(Math.abs(ax)<150) zM=Math.min(zM,PARK.z0-12);
  if(zM-zm<60) return;
  const lanes=edge?[-4.5,-1.5,1.5,4.5]:[-4.5,-1.5,1.5,4.5];
  const n=Math.floor((zM-zm)/(isMobile?30:22));
  for(let k=0;k<n;k++){
    const lane=lanes[k%4], d=edge?(lane<0?1:-1):dir;
    cars.push({axis:'z',fixed:ax+lane,pos:rr(zm,zM),min:zm,max:zM,dir:d,speed:rr(16,32),w:2,l:rr(4.2,5),c:carColor()});
  }
});
for(let k=1;k<95;k+=5){
  const zs=-1440+k*ST; if(zs>PARK.z0-10&&zs<PARK.z1+10) continue;
  const hw=halfW(zs)-8; if(hw<60) continue;
  const dir=k%2?1:-1, n=Math.floor(2*hw/(isMobile?36:26));
  for(let j=0;j<n;j++) cars.push({axis:'x',fixed:zs+(j%2?1.6:-1.6),pos:rr(-hw,hw),min:-hw,max:hw,dir,speed:rr(10,22),w:2,l:rr(4.2,5),c:carColor()});
}
const carMesh=new THREE.InstancedMesh(boxBase,new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.35,metalness:0.3}),cars.length);
cars.forEach((c,i)=>carMesh.setColorAt(i,c.c)); carMesh.instanceColor.needsUpdate=true;
carMesh.frustumCulled=false; carMesh.castShadow=false; scene.add(carMesh);
const headArr=new Float32Array(cars.length*3), tailArr=new Float32Array(cars.length*3);
const headPts=makePoints(Array.from(headArr),0xfff4e0,3.2,2.4);
const tailPts=makePoints(Array.from(tailArr),0xff2b1c,2.6,2.6);
function updateCars(dt){
  const ha=headPts.geometry.attributes.position.array, ta=tailPts.geometry.attributes.position.array;
  for(let i=0;i<cars.length;i++){
    const c=cars[i];
    c.pos+=c.dir*c.speed*dt;
    if(c.pos>c.max) c.pos=c.min; else if(c.pos<c.min) c.pos=c.max;
    let x,z,fx=0,fz=0;
    if(c.axis==='z'){ x=c.fixed; z=c.pos; fz=c.dir; dummy.rotation.set(0,0,0); }
    else { x=c.pos; z=c.fixed; fx=c.dir; dummy.rotation.set(0,Math.PI/2,0); }
    dummy.position.set(x,0.35,z); dummy.scale.set(c.w,1.4,c.l); dummy.updateMatrix(); carMesh.setMatrixAt(i,dummy.matrix);
    const hl=c.l/2+0.4;
    ha[i*3]=x+fx*hl; ha[i*3+1]=1.1; ha[i*3+2]=z+fz*hl;
    ta[i*3]=x-fx*hl; ta[i*3+1]=1.1; ta[i*3+2]=z-fz*hl;
  }
  carMesh.instanceMatrix.needsUpdate=true;
  headPts.geometry.attributes.position.needsUpdate=true; tailPts.geometry.attributes.position.needsUpdate=true;
}

/* ---------- boats ---------- */
const boats=[];
const hullMat=new THREE.MeshStandardMaterial({color:C(0xe9e6df),roughness:0.6});
const cabinMat=new THREE.MeshStandardMaterial({color:C(0x2b3440),roughness:0.4,metalness:0.3});
for(let i=0;i<9;i++){
  const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.BoxGeometry(7,2.6,22),hullMat); hull.position.y=0.6; g.add(hull);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(5,3,9),cabinMat); cab.position.set(0,3.2,-2); g.add(cab);
  g.traverse(o=>{o.castShadow=true;});
  const east=i%2===0, x=east?rr(420,560):rr(-520,-390);
  const b={g,x,z:rr(-1500,1500),dir:rand()<0.5?1:-1,speed:rr(6,12)};
  if(b.dir<0) g.rotation.y=Math.PI;
  g.position.set(b.x,-1.5,b.z); scene.add(g); boats.push(b);
}
function updateBoats(dt,t){
  boats.forEach((b,i)=>{ b.z+=b.dir*b.speed*dt; if(b.z>1700) b.z=-1700; if(b.z<-1700) b.z=1700; b.g.position.set(b.x,-1.5+Math.sin(t*1.3+i)*0.25,b.z); });
}

/* ---------- post-processing ---------- */
let rt;
if(renderer.capabilities.isWebGL2 && THREE.WebGLMultisampleRenderTarget){
  const hf=!!renderer.extensions.get('EXT_color_buffer_float');
  rt=new THREE.WebGLMultisampleRenderTarget(innerWidth*DPR,innerHeight*DPR,{format:THREE.RGBAFormat,type:hf?THREE.HalfFloatType:THREE.UnsignedByteType});
  rt.samples=4;
}
const composer=new THREE.EffectComposer(renderer,rt);
composer.setPixelRatio(DPR); composer.setSize(innerWidth,innerHeight);
composer.addPass(new THREE.RenderPass(scene,camera));
const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.6,0.5,0.75);
composer.addPass(bloom);
composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));

/* ---------- lighting moods ---------- */
const RAW={
  day:  {el:50,az:2.35,sunCol:0xfff1dc,sunI:2.1,hemiSky:0xc4dcff,hemiGround:0x5d554a,hemiI:0.55,top:0x2d6bd0,hor:0xcde2f2,bot:0x9aa9b5,fog:0xc2d6e6,fogD:0.00016,night:0,exp:1.0,bloomS:0.12,bloomT:0.93,bloomR:0.4,sunGlow:0xfff3d6,sunSize:1,stars:0,lamp:0},
  dusk: {el:4,az:-1.95,sunCol:0xff9a55,sunI:1.7,hemiSky:0xffb38a,hemiGround:0x2d2633,hemiI:0.42,top:0x1f2f5e,hor:0xff9050,bot:0x2a2228,fog:0xb9806f,fogD:0.00021,night:0.75,exp:1.05,bloomS:0.6,bloomT:0.78,bloomR:0.5,sunGlow:0xffa860,sunSize:1,stars:0.15,lamp:0.8},
  night:{el:38,az:-0.8,sunCol:0x8fa8ff,sunI:0.3,hemiSky:0x1e2c4d,hemiGround:0x0a0a10,hemiI:0.3,top:0x01030a,hor:0x1a2440,bot:0x06070b,fog:0x131b2e,fogD:0.00025,night:1,exp:1.12,bloomS:1.05,bloomT:0.6,bloomR:0.55,sunGlow:0xbcd0ff,sunSize:0.25,stars:1,lamp:1}
};
const P={};
for(const k in RAW){ P[k]={}; for(const f in RAW[k]){ const v=RAW[k][f]; P[k][f]=['sunCol','hemiSky','hemiGround','top','hor','bot','fog','sunGlow'].includes(f)?C(v):v; } }
const clone=s=>{ const o={}; for(const k in s) o[k]=s[k].isColor?s[k].clone():s[k]; return o; };
let target=P.dusk; const cur=clone(P.dusk);
const sunDir=new THREE.Vector3();
function apply(){
  const el=cur.el*Math.PI/180;
  sunDir.set(Math.cos(el)*Math.sin(cur.az),Math.sin(el),Math.cos(el)*Math.cos(cur.az));
  sun.position.copy(sun.target.position).addScaledVector(sunDir,3600);
  sun.color.copy(cur.sunCol); sun.intensity=cur.sunI;
  hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGround); hemi.intensity=cur.hemiI;
  skyU.top.value.copy(cur.top); skyU.horizon.value.copy(cur.hor); skyU.bottom.value.copy(cur.bot);
  skyU.sunDir.value.copy(sunDir); skyU.sunColor.value.copy(cur.sunGlow); skyU.sunSize.value=cur.sunSize; skyU.stars.value=cur.stars;
  scene.fog.color.copy(cur.fog); scene.fog.density=cur.fogD;
  uNight.value=cur.night; renderer.toneMappingExposure=cur.exp;
  bloom.strength=cur.bloomS; bloom.threshold=cur.bloomT; bloom.radius=cur.bloomR;
  streetPts.material.opacity=cur.lamp; boroPts.material.opacity=cur.lamp*0.8;
  headPts.material.opacity=Math.max(cur.lamp,0.15); tailPts.material.opacity=Math.max(cur.lamp,0.2);
  necklacePts.material.opacity=cur.lamp;
}
function step(dt){
  const k=1-Math.exp(-dt*2.2); let diff=0;
  for(const f in cur){
    if(cur[f].isColor){ const a=cur[f].r+cur[f].g+cur[f].b; cur[f].lerp(target[f],k); diff+=Math.abs(cur[f].r+cur[f].g+cur[f].b-a); }
    else { const d=(target[f]-cur[f])*k; cur[f]+=d; diff+=Math.abs(d); }
  }
  apply(); return diff;
}
apply(); updateEnv();

/* ---------- UI ---------- */
const modeBtns=[...document.querySelectorAll('[data-mode]')];
modeBtns.forEach(b=>b.addEventListener('click',()=>{ target=P[b.dataset.mode]; modeBtns.forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }));
let tour=true, idle=null;
const tourBtn=document.getElementById('tour');
tourBtn.addEventListener('click',()=>{ tour=!tour; controls.autoRotate=tour; tourBtn.setAttribute('aria-pressed',String(tour)); });
controls.addEventListener('start',()=>{ controls.autoRotate=false; clearTimeout(idle); });
controls.addEventListener('end',()=>{ if(tour) idle=setTimeout(()=>{ controls.autoRotate=true; },5000); });
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ tour=false; controls.autoRotate=false; tourBtn.setAttribute('aria-pressed','false'); }

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

/* ---------- loop ---------- */
const clock=new THREE.Clock(); let frame=0;
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  uTime.value+=dt;
  const diff=step(dt);
  if(diff>0.003 && frame%14===0) updateEnv();
  updateCars(dt); updateBoats(dt,uTime.value);
  warnPts.material.opacity=(Math.sin(uTime.value*2.4)>0.2?1:0.15)*Math.max(cur.lamp,0.35);
  sky.position.copy(camera.position);
  controls.update();
  composer.render();
  if(++frame===3) document.getElementById('loader').classList.add('gone');
  requestAnimationFrame(tick);
}
tick();
})();
